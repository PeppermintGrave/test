
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b0b">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
<title>PeppermintGrave | Shields Showcase</title>

<style>
:root {
    --bg: #080b0b;
    --panel: #101716;
    --panel2: #141e1b;
    --border: #24332e;
    --green: #72fbd1;
    --green2: #35b997;
    --text: #e1eee8;
    --muted: #82958b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background:
        radial-gradient(ellipse at 50% -20%, #174438 0%, transparent 55%),
        var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    min-height: 100vh;
}

header {
    padding: 65px 20px 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
}

.brand {
    color: var(--green);
    font-size: 13px;
    letter-spacing: 5px;
    margin-bottom: 24px;
}

h1 {
    font-family: Impact, sans-serif;
    font-size: clamp(36px, 7vw, 68px);
    font-weight: 400;
    letter-spacing: 2px;
}

h1 span {
    color: var(--green);
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 15px;
    line-height: 1.8;
}

.domain {
    display: inline-block;
    margin-top: 23px;
    border: 1px solid #315d4d;
    padding: 10px 17px;
    color: var(--green);
    font-size: 12px;
    background: #10241e;
    border-radius: 5px;
}

.container {
    max-width: 1150px;
    padding: 35px 20px;
    margin: auto;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
}

input, select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px;
    border-radius: 5px;
    outline: none;
    font-family: inherit;
}

input {
    flex: 1;
    min-width: 180px;
}

input:focus, select:focus {
    border-color: var(--green2);
}

.section {
    margin: 40px 0;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 13px;
    margin-bottom: 18px;
}

.section-title h2 {
    color: var(--green);
    font-size: 17px;
    font-weight: 400;
}

.count {
    color: var(--muted);
    font-size: 11px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 13px;
}

.badge-card {
    background: linear-gradient(145deg, var(--panel2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 17px;
    min-width: 0;
    transition: .2s;
}

.badge-card:hover {
    border-color: var(--green2);
    transform: translateY(-2px);
}

.badge-name {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 15px;
}

.badge-preview {
    min-height: 35px;
    display: flex;
    align-items: center;
    overflow: hidden;
    margin-bottom: 15px;
}

.badge-preview img {
    max-width: 100%;
    height: auto;
}

.badge-url {
    background: #080d0b;
    border: 1px solid #25332e;
    border-radius: 4px;
    padding: 9px;
    color: #8ea79a;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 12px;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    background: #19382d;
    border: 1px solid #315b48;
    color: var(--green);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #245541;
}

button.secondary {
    background: #171f1c;
    border-color: var(--border);
    color: var(--muted);
}

.empty {
    display: none;
    color: var(--muted);
    text-align: center;
    padding: 50px;
}

footer {
    text-align: center;
    padding: 35px 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    line-height: 2;
}

footer span {
    color: var(--green);
}

@media(max-width: 500px) {
    header {
        padding-top: 45px;
    }
    .container {
        padding: 25px 13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">PEPPERMINT STUDIOS</div>

    <h1>SHIELDS<span>.</span>IO</h1>

    <p class="subtitle">
        A collection of Shields.io badges.<br>
        Explore. Preview. Copy. Integrate.
    </p>

    <div class="domain">peppermint-grave.is-pro.dev</div>
</header>

<main class="container">

    <div class="toolbar">
        <input
            type="search"
            id="search"
            placeholder="Search badges..."
            autocomplete="off"
        >

        <select id="style">
            <option value="flat">Flat</option>
            <option value="flat-square">Flat Square</option>
            <option value="plastic">Plastic</option>
            <option value="for-the-badge">For The Badge</option>
            <option value="social">Social</option>
        </select>
    </div>

    <div id="showcase"></div>

    <div class="empty" id="empty">
        No badges found.
    </div>

</main>

<footer>
    <span>❧ PeppermintGrave</span><br>
    Shields.io Badge Showcase<br>
    Powered by Shields.io and Simple Icons.
</footer>

<script>
const categories = {

    "Package Managers & Tools": [

        ["ESLint", "eslint", "ESLint", "4B32C3"],
        ["Prettier", "prettier", "Prettier", "F7B93E"]
    ]
};

const styles = [
    "flat",
    "flat-square",
    "plastic",
    "for-the-badge",
    "social"
];

const showcase = document.getElementById("showcase");
const search = document.getElementById("search");
const styleSelect = document.getElementById("style");
const empty = document.getElementById("empty");

function createBadgeUrl(item, style) {
    const [name, logo, message, color] = item;

    const params = new URLSearchParams({
        style,
        logo,
        logoColor: "white",
        label: name,
        color,
        cacheSeconds: "86400"
    });

    return "https://img.shields.io/static/v1?" + params.toString();
}

function createCard(item, style) {
    const [name] = item;
    const url = createBadgeUrl(item, style);

    return `
        <article class="badge-card" data-name="${name.toLowerCase()}">
            <div class="badge-name">${name}</div>

            <div class="badge-preview">
                <img
                    src="${url}"
                    alt="${name} badge"
                    loading="lazy"
                >
            </div>

            <div class="badge-url">${url}</div>

            <div class="actions">
                <button onclick="copyText('${escapeJS(url)}')">
                    COPY URL
                </button>

                <button class="secondary"
                    onclick="copyText('${escapeJS(`<img src="${url}" alt="${name}">`)}')">
                    HTML
                </button>

                <button class="secondary"
                    onclick="copyText('${escapeJS(`![${name}](${url})`)}')">
                    MD
                </button>
            </div>
        </article>
    `;
}

function escapeJS(value) {
    return value
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n");
}

function render() {
    const query = search.value.toLowerCase().trim();
    const style = styleSelect.value;

    let html = "";
    let visibleCount = 0;

    for (const [category, items] of Object.entries(categories)) {
        const filtered = items.filter(item =>
            item[0].toLowerCase().includes(query) ||
            category.toLowerCase().includes(query)
        );

        if (!filtered.length) continue;

        visibleCount += filtered.length;

        html += `
            <section class="section">
                <div class="section-title">
                    <h2>${category}</h2>
                    <span class="count">
                        ${filtered.length} BADGES
                    </span>
                </div>

                <div class="grid">
                    ${filtered.map(item =>
                        createCard(item, style)
                    ).join("")}
                </div>
            </section>
        `;
    }

    showcase.innerHTML = html;
    empty.style.display = visibleCount ? "none" : "block";
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        showToast("Copied successfully!");
    } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        showToast("Copied!");
    }
}

let toastTimer;

function showToast(message) {
    let toast = document.getElementById("toast");

    if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast";

        Object.assign(toast.style, {
            position: "fixed",
            bottom: "25px",
            left: "50%",
            transform: "translateX(-50%)",
            background: "#19382d",
            border: "1px solid #72fbd1",
            color: "#72fbd1",
            padding: "12px 20px",
            borderRadius: "5px",
            fontSize: "12px",
            zIndex: "9999"
        });

        document.body.appendChild(toast);
    }

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 1800);
}

search.addEventListener("input", render);
styleSelect.addEventListener("change", render);

render();
</script>
